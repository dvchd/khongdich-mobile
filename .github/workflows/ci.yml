name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    name: Analyze + Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: '3.44.2'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Pub get
        run: flutter pub get

      - name: Generate Drift codegen
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  build-android:
    name: Build Android (APK + AAB prod)
    needs: analyze-and-test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write  # required for softprops/action-gh-release
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: '3.44.2'
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Generate Drift codegen
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Decode release keystore
        if: env.KHONGDICH_KEYSTORE_BASE64 != ''
        env:
          KHONGDICH_KEYSTORE_BASE64: ${{ secrets.KHONGDICH_KEYSTORE_BASE64 }}
        run: |
          echo "$KHONGDICH_KEYSTORE_BASE64" | base64 -d > /tmp/khongdich-release.jks
          echo "Keystore decoded: $(ls -la /tmp/khongdich-release.jks)"

      # Firebase google-services.json decoding đã bị bỏ — app không còn
      # dùng Firebase. google_sign_in hoạt động độc lập.
      # GOOGLE_WEB_CLIENT_ID đã được hardcode trong lib/core/auth/auth_service.dart
      # (public identifier, không phải secret).

      - name: Validate tag matches pubspec version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PUB_VERSION=$(grep -E '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          echo "tag=$TAG_VERSION pubspec=$PUB_VERSION"
          [ "$TAG_VERSION" = "$PUB_VERSION" ] || {
            echo "::error::Tag v$TAG_VERSION không khớp pubspec version $PUB_VERSION"
            exit 1
          }

      - name: Build APK
        env:
          KHONGDICH_KEYSTORE_BASE64: ${{ secrets.KHONGDICH_KEYSTORE_BASE64 }}
          KHONGDICH_KEYSTORE_PASSWORD: ${{ secrets.KHONGDICH_KEYSTORE_PASSWORD }}
          KHONGDICH_KEY_ALIAS: ${{ secrets.KHONGDICH_KEY_ALIAS }}
          KHONGDICH_KEY_PASSWORD: ${{ secrets.KHONGDICH_KEY_PASSWORD }}
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6g -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2"
        run: |
          flutter build apk --release --no-tree-shake-icons \
            --dart-define=APP_ENV=prod \
            --flavor=prod

      - name: Build AAB (Google Play)
        env:
          KHONGDICH_KEYSTORE_BASE64: ${{ secrets.KHONGDICH_KEYSTORE_BASE64 }}
          KHONGDICH_KEYSTORE_PASSWORD: ${{ secrets.KHONGDICH_KEYSTORE_PASSWORD }}
          KHONGDICH_KEY_ALIAS: ${{ secrets.KHONGDICH_KEY_ALIAS }}
          KHONGDICH_KEY_PASSWORD: ${{ secrets.KHONGDICH_KEY_PASSWORD }}
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6g -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2"
        run: |
          flutter build appbundle --release --no-tree-shake-icons \
            --dart-define=APP_ENV=prod \
            --flavor=prod

      - name: Rename artifacts with build sha
        run: |
          SHA=${GITHUB_SHA::7}
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-prod-release.apk \
             artifacts/khongdich-prod-${SHA}.apk
          cp build/app/outputs/bundle/prodRelease/app-prod-release.aab \
             artifacts/khongdich-prod-${SHA}.aab
          ls -la artifacts/

      - name: Upload artifacts to workflow run
        uses: actions/upload-artifact@v7
        with:
          name: khongdich-prod-${{ github.sha }}
          path: artifacts/*
          retention-days: 30

      - name: Publish to GitHub Releases (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/*.apk
            artifacts/*.aab
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') }}
