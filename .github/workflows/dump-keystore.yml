name: Dump keystore backup (temporary)

on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Write keystore and credentials
        env:
          KEYSTORE_B64: ${{ secrets.KHONGDICH_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.KHONGDICH_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KHONGDICH_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KHONGDICH_KEY_PASSWORD }}
        run: |
          mkdir -p out
          echo "$KEYSTORE_B64" | base64 -d > out/khongdich-release.jks
          cat > out/khongdich-credentials.txt <<EOF
          KHONGDICH_KEYSTORE_PASSWORD=$STORE_PASS
          KHONGDICH_KEY_ALIAS=$KEY_ALIAS
          KHONGDICH_KEY_PASSWORD=$KEY_PASS
          EOF
          ls -la out/
      - uses: actions/upload-artifact@v4
        with:
          name: khongdich-keystore-backup
          path: out/
          retention-days: 1
