name: khongdich_mobile
description: "Không Dịch — Mobile reader app for khongdich.com (Android first)."
publish_to: 'none'
version: 0.7.0+15

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.4.2

  # Routing
  go_router: ^17.5.0

  # Network (no cookies — Bearer JWT only)
  dio: ^5.11.0

  # Local DB
  drift: ^2.34.3
  # sqlite3 3.x tự bundle native libs qua hooks/native assets — không cần
  # sqlite3_flutter_libs nữa (0.6.0 đánh dấu EOL: "update to sqlite3 3.x")

  # Storage
  flutter_secure_storage: ^11.0.0
  shared_preferences: ^2.3.0
  path_provider: ^2.1.4

  # UI
  cached_network_image: ^3.4.1
  # Cache ảnh dùng chung (AppImageCache) — cache lâu dài ảnh CDN immutable,
  # import trực tiếp nên phải khai báo (không chỉ transitive qua
  # cached_network_image).
  flutter_cache_manager: ^3.4.1
  shimmer: ^4.0.0
  google_fonts: ^8.2.1
  photo_view: ^0.15.0

  # YouTube player (for video content_type)
  youtube_player_flutter: ^10.0.0

  # Audio (on-device TTS)
  audio_service: ^0.18.19
  flutter_tts: ^4.2.5
  audio_session: ^0.2.4
  # Share sheet cho tác giả tải audio chương (TTS → WAV → lưu/chia sẻ)
  share_plus: ^13.3.0

  # Auth — Google Sign-In → exchange idToken for server JWT
  google_sign_in: ^7.2.0

  # Push notifications: KHÔNG dùng Firebase. App dùng in-app notifications
  # (GET /api/v1/mobile/notifications) + media notification của audio_service
  # cho TTS. Khi cần FCM push: re-add firebase_core + firebase_messaging +
  # google-services.json + backend push_devices.

  # Update check qua Google Play In-App Updates — chỉ hoạt động khi app
  # được cài từ CH Play (build debug/sideload APK sẽ throw → bắt lỗi im lặng).
  # Không dùng Firebase/FCM cho việc này (đã loại bỏ có chủ ý, xem trên đầu).
  in_app_update: ^5.0.0

  # Utils
  logger: ^2.4.0
  url_launcher: ^6.3.0
  path: ^1.9.0
  package_info_plus: ^10.2.1
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.34.5
  build_runner: ^2.16.0
  flutter_lints: ^6.0.0

# NOTE: apple_sign_in / app_links / firebase_crashlytics / firebase_analytics
# are intentionally not yet wired (iOS Phase 3 + observability rollout).
# See README.md "Wiring the Phase-2 subsystems".

flutter:
  uses-material-design: true
  assets:
    - test/fixtures/
    - assets/icons/
